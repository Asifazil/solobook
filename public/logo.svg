  <!-- Ledger lines -->
  <line x1="11" y1="16.5" x2="18.5" y2="15.8" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <line x1="11" y1="20"   x2="18.5" y2="19.3" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <line x1="11" y1="23.5" x2="18.5" y2="22.8" stroke="#4F46E5" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>

